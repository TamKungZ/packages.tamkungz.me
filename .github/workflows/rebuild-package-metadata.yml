name: Rebuild Package Repository Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-metadata:
    name: Rebuild packages.tamkungz.me metadata
    runs-on: ubuntu-latest

    steps:
      - name: Install repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev gnupg git

      - name: Import GPG key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY secret is required to sign repository metadata."
            exit 1
          fi

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          GPG_FINGERPRINT="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$GPG_FINGERPRINT" ]; then
            echo "Could not detect GPG fingerprint."
            exit 1
          fi

          echo "GPG_FINGERPRINT=$GPG_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          repository: TamKungZ/packages.tamkungz.me
          ref: main
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: packages-site
          fetch-depth: 1

      - name: Rebuild APT metadata
        shell: bash
        working-directory: packages-site/apt
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if ! find pool -type f -name '*.deb' -print -quit | grep -q .; then
            echo "No .deb packages found under apt/pool."
            exit 1
          fi

          # Generate a complete index first, without --arch. This intentionally
          # does not depend on filenames ending in _amd64.deb/_arm64.deb.
          ALL_PACKAGES="$(mktemp)"
          trap 'rm -f "$ALL_PACKAGES"' EXIT
          apt-ftparchive packages pool > "$ALL_PACKAGES"

          # Discover architectures from the control metadata inside each .deb.
          mapfile -t APT_ARCHES < <(
            while IFS= read -r -d '' deb; do
              arch="$(dpkg-deb -f "$deb" Architecture)"
              if [ "$arch" != "all" ]; then
                printf '%s\n' "$arch"
              fi
            done < <(find pool -type f -name '*.deb' -print0) | sort -u
          )

          if [ "${#APT_ARCHES[@]}" -eq 0 ]; then
            echo "No architecture-specific DEB packages found."
            exit 1
          fi

          printf 'APT architectures: %s\n' "${APT_ARCHES[*]}"

          for arch in "${APT_ARCHES[@]}"; do
            index="dists/stable/main/binary-${arch}/Packages"
            mkdir -p "$(dirname "$index")"

            awk -v wanted="$arch" '
              BEGIN { RS=""; FS="\n"; ORS="\n\n" }
              {
                package_arch=""
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Architecture:[[:space:]]*/) {
                    package_arch=$i
                    sub(/^Architecture:[[:space:]]*/, "", package_arch)
                    break
                  }
                }
                if (package_arch == wanted || package_arch == "all") print $0
              }
            ' "$ALL_PACKAGES" > "$index"

            gzip -9fk "$index"
          done

          # Verify every .deb is indexed according to the Architecture field
          # inside the package. Any missing package aborts before the repo is pushed.
          while IFS= read -r -d '' deb; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            rel="${deb#./}"

            if [ "$arch" = "all" ]; then
              for target_arch in "${APT_ARCHES[@]}"; do
                index="dists/stable/main/binary-${target_arch}/Packages"
                if ! grep -Fqx "Filename: $rel" "$index"; then
                  echo "ERROR: $package $version ($arch) missing from binary-${target_arch}/Packages: $rel"
                  exit 1
                fi
              done
            else
              index="dists/stable/main/binary-${arch}/Packages"
              if [ ! -f "$index" ] || ! grep -Fqx "Filename: $rel" "$index"; then
                echo "ERROR: $package $version ($arch) missing from binary-${arch}/Packages: $rel"
                exit 1
              fi
            fi
          done < <(find pool -type f -name '*.deb' -print0)

          # Make the current Glosslate problem visible in the Actions log.
          if find pool/main/g/glosslate -type f -name '*.deb' -print -quit 2>/dev/null | grep -q .; then
            echo "Glosslate entries now present in APT metadata:"
            grep -n -A20 -B1 '^Package: glosslate$' dists/stable/main/binary-amd64/Packages || {
              echo "ERROR: Glosslate package exists in the pool but is absent from binary-amd64/Packages."
              exit 1
            }
          fi

          ARCHITECTURES="$(printf '%s\n' "${APT_ARCHES[@]}" | sort -u | xargs)"

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="TamKungZ_" \
            -o APT::FTPArchive::Release::Label="TamKungZ_ Packages" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="$ARCHITECTURES" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="TamKungZ_ APT Package Repository" \
            release dists/stable > dists/stable/Release

          rm -f dists/stable/InRelease dists/stable/Release.gpg

          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --default-key "$GPG_FINGERPRINT" \
              --clearsign \
              -o dists/stable/InRelease dists/stable/Release

            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --default-key "$GPG_FINGERPRINT" \
              -abs \
              -o dists/stable/Release.gpg dists/stable/Release
          else
            gpg --batch --yes \
              --default-key "$GPG_FINGERPRINT" \
              --clearsign \
              -o dists/stable/InRelease dists/stable/Release

            gpg --batch --yes \
              --default-key "$GPG_FINGERPRINT" \
              -abs \
              -o dists/stable/Release.gpg dists/stable/Release
          fi

      - name: Rebuild RPM metadata
        shell: bash
        working-directory: packages-site
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          while IFS= read -r -d '' repo_dir; do
            if ! find "$repo_dir" -maxdepth 1 -type f -name '*.rpm' -print -quit | grep -q .; then
              echo "Skipping $repo_dir: no RPM packages."
              continue
            fi

            echo "Rebuilding $repo_dir"
            rm -rf "$repo_dir/repodata"
            createrepo_c "$repo_dir"

            repomd="$repo_dir/repodata/repomd.xml"
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes \
                --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --default-key "$GPG_FINGERPRINT" \
                --detach-sign \
                --armor \
                "$repomd"
            else
              gpg --batch --yes \
                --default-key "$GPG_FINGERPRINT" \
                --detach-sign \
                --armor \
                "$repomd"
            fi
          done < <(find rpm -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

      - name: Refresh public key and site indexes
        shell: bash
        working-directory: packages-site
        run: |
          set -euo pipefail
          gpg --armor --export "$GPG_FINGERPRINT" > gpg.key

          if [ -f scripts/build_site.py ]; then
            python3 scripts/build_site.py
          fi

      - name: Commit and push metadata
        shell: bash
        working-directory: packages-site
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Metadata is already up to date."
            exit 0
          fi

          git commit -m "Rebuild package repository metadata"
          git push origin HEAD:main
